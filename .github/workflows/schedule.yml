name: Run Python Script

# いつ実行するか（日本時間の毎日朝9時 ＋ 手動実行ボタン）
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 実行する内容
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run script
      run: python main.py
